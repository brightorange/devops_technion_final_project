sonar.projectKey=shop-api
sonar.projectName=Shop API

# Application code and tests are declared separately so Sonar does not report
# issues in test files as production defects, while still measuring them.
sonar.sources=backend/app
sonar.tests=backend/tests

sonar.python.version=3.14

# Produced by the pytest job and passed through as a CI artifact.
sonar.python.coverage.reportPaths=reports/coverage.xml

# Alembic migration scripts are generated and are never edited by hand.
sonar.exclusions=backend/migrations/**
