# CI for the application repo: lint, test, scan, build, publish.
# Deployment lives in the infra repo's pipeline, which owns the Helm chart.
#
# Jobs run on a self-managed shell runner on the developer's machine. GitLab's
# shared runners are in their cloud and have no route to the local Minikube,
# whose API server is on 127.0.0.1.

stages:
  - lint
  - test
  - scan          # secrets — before anything is built
  - build
  - image-scan    # CVEs — needs the built image to exist
  - publish

variables:
  IMAGE: shop-api
  # SonarQube runs on the same host as the runner. SONAR_TOKEN is a masked
  # CI/CD variable, set in the project's settings rather than committed.
  SONAR_HOST_URL: "http://localhost:9000"
  # GitLab clones shallow by default. GitLeaks scans history, and a credential
  # that was committed and later deleted is still leaked, so fetch everything.
  GIT_DEPTH: "0"

default:
  tags:
    - local
  interruptible: true

# The test image carries dev dependencies and the test sources. Docker layer
# caching makes the repeat build in the second job near-instant, and building it
# per job keeps the jobs independent of each other's leftovers.
.uses_test_image:
  before_script:
    - docker build --target test -t "$IMAGE:test-$CI_COMMIT_SHORT_SHA" backend

flake8:
  extends: .uses_test_image
  stage: lint
  script:
    - docker run --rm "$IMAGE:test-$CI_COMMIT_SHORT_SHA" flake8

pytest:
  extends: .uses_test_image
  stage: test
  script:
    - mkdir -p reports
    # Tests run inside the image so they execute against the exact Python and
    # dependency set that ships.
    - |
      docker run --rm -v "$CI_PROJECT_DIR/reports:/out" "$IMAGE:test-$CI_COMMIT_SHORT_SHA" \
        pytest -q --junitxml=/out/report.xml --cov-report=xml:/out/coverage.xml
  coverage: '/TOTAL.*?(\d+\%)$/'
  artifacts:
    when: always
    # The raw file is kept as well as the parsed report, because the SonarQube
    # job in the next stage consumes it.
    paths:
      - reports/coverage.xml
    reports:
      junit: reports/report.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

# ---- Static analysis (SAST) ----
# SonarQube runs as build infrastructure on the same machine as the runner, not
# in the application cluster. SONAR_TOKEN is a masked CI/CD variable.
sonarqube:
  stage: scan
  needs:
    - job: pytest
      artifacts: true
  script:
    # Coverage records the path inside the build container, which does not
    # exist on the host. Rewrite it to the repository-relative path so Sonar
    # can match the report to the source files.
    # Written to a temp file rather than with `sed -i`, whose syntax differs
    # between BSD (macOS runners) and GNU sed.
    - |
      sed 's|<source>/src/app</source>|<source>backend/app</source>|' \
        reports/coverage.xml > reports/coverage.fixed.xml
      mv reports/coverage.fixed.xml reports/coverage.xml
    # qualitygate.wait makes the scanner poll the server and exit non-zero if
    # the gate fails. Without it the job only uploads a report and is green
    # whatever the result, which is a gate in name only.
    - |
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=true

# ---- Security gate 1: secrets ----
gitleaks:
  stage: scan
  script:
    - |
      gitleaks detect --source . --redact --no-banner \
        --report-format junit --report-path gitleaks-report.xml
  artifacts:
    when: always
    reports:
      junit: gitleaks-report.xml

docker-build:
  stage: build
  script:
    - docker build --target runtime -t "$IMAGE:$CI_COMMIT_SHORT_SHA" backend

# ---- Security gate 2: image vulnerabilities ----
# --ignore-unfixed is deliberate. The base image carries ~50 HIGH/CRITICAL CVEs
# with no upstream patch available; failing on those would make the gate
# unsatisfiable, and an unsatisfiable gate gets switched off. The build fails on
# what can actually be remediated.
trivy:
  stage: image-scan
  script:
    - |
      trivy image --scanners vuln --severity HIGH,CRITICAL \
        --ignore-unfixed --exit-code 1 --no-progress "$IMAGE:$CI_COMMIT_SHORT_SHA"

# Minikube keeps its own image store, so a locally built image has to be
# side-loaded before the cluster can run it. Replaced by a registry push once
# the cloud environment exists.
minikube-load:
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:dev"
    - minikube image load "$IMAGE:dev"
