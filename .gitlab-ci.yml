# CI for the application repo: lint, test, scan, build, publish.
# Deployment lives in the infra repo's pipeline, which owns the Helm chart.
#
# Jobs run on a self-managed shell runner on the developer's machine. GitLab's
# shared runners are in their cloud and have no route to the local Minikube,
# whose API server is on 127.0.0.1.

stages:
  - lint
  - test
  - scan          # secrets and SAST — before anything is built
  - build
  - image-scan    # SBOM and CVEs — need the built image to exist
  - report        # collect every finding into one durable artifact
  - publish

variables:
  IMAGE: shop-api
  # SonarQube runs on the same host as the runner. SONAR_TOKEN is a masked
  # CI/CD variable, set in the project's settings rather than committed.
  SONAR_HOST_URL: "http://localhost:9000"
  # GitLab clones shallow by default. GitLeaks scans history, and a credential
  # that was committed and later deleted is still leaked, so fetch everything.
  GIT_DEPTH: "0"

default:
  tags:
    - local
  interruptible: true

# The test image carries dev dependencies and the test sources. Docker layer
# caching makes the repeat build in the second job near-instant, and building it
# per job keeps the jobs independent of each other's leftovers.
.uses_test_image:
  before_script:
    - docker build --target test -t "$IMAGE:test-$CI_COMMIT_SHORT_SHA" backend

flake8:
  extends: .uses_test_image
  stage: lint
  script:
    - docker run --rm "$IMAGE:test-$CI_COMMIT_SHORT_SHA" flake8

pytest:
  extends: .uses_test_image
  stage: test
  script:
    - mkdir -p reports
    # Tests run inside the image so they execute against the exact Python and
    # dependency set that ships.
    - |
      docker run --rm -v "$CI_PROJECT_DIR/reports:/out" "$IMAGE:test-$CI_COMMIT_SHORT_SHA" \
        pytest -q --junitxml=/out/report.xml --cov-report=xml:/out/coverage.xml
  coverage: '/TOTAL.*?(\d+\%)$/'
  artifacts:
    when: always
    # The raw file is kept as well as the parsed report, because the SonarQube
    # job in the next stage consumes it.
    paths:
      - reports/coverage.xml
    reports:
      junit: reports/report.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

# ---- Static analysis (SAST) ----
# SonarQube runs as build infrastructure on the same machine as the runner, not
# in the application cluster. SONAR_TOKEN is a masked CI/CD variable.
sonarqube:
  stage: scan
  needs:
    - job: pytest
      artifacts: true
  script:
    # Coverage records the path inside the build container, which does not
    # exist on the host. Rewrite it to the repository-relative path so Sonar
    # can match the report to the source files.
    # Written to a temp file rather than with `sed -i`, whose syntax differs
    # between BSD (macOS runners) and GNU sed.
    - |
      sed 's|<source>/src/app</source>|<source>backend/app</source>|' \
        reports/coverage.xml > reports/coverage.fixed.xml
      mv reports/coverage.fixed.xml reports/coverage.xml
    # qualitygate.wait makes the scanner poll the server and exit non-zero if
    # the gate fails. Without it the job only uploads a report and is green
    # whatever the result, which is a gate in name only.
    - |
      sonar-scanner \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=true
  after_script:
    # after_script so the summary is captured even when the gate fails, which
    # is exactly when someone wants to read it.
    - mkdir -p reports
    - |
      curl -sf -u "$SONAR_TOKEN:" \
        "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=shop-api" \
        -o reports/sonarqube.json || echo '{}' > reports/sonarqube.json
  artifacts:
    when: always
    paths:
      - reports/sonarqube.json

# ---- Security gate 1: secrets ----
gitleaks:
  stage: scan
  script:
    - mkdir -p reports
    # JSON for the compliance report, JUnit for GitLab's test-results tab.
    # One --report-format per run, and the scan takes well under a second.
    # `|| true` on the first so a leak still reaches the second run and the
    # artifact; the second decides the job.
    - |
      gitleaks detect --source . --redact --no-banner \
        --report-format json --report-path reports/gitleaks.json || true
    - |
      gitleaks detect --source . --redact --no-banner \
        --report-format junit --report-path gitleaks-report.xml
  artifacts:
    when: always
    paths:
      - reports/gitleaks.json
    reports:
      junit: gitleaks-report.xml

docker-build:
  stage: build
  script:
    - docker build --target runtime -t "$IMAGE:$CI_COMMIT_SHORT_SHA" backend

# ---- Security gate 2: image vulnerabilities ----
# --ignore-unfixed is deliberate. The base image carries ~50 HIGH/CRITICAL CVEs
# with no upstream patch available; failing on those would make the gate
# unsatisfiable, and an unsatisfiable gate gets switched off. The build fails on
# what can actually be remediated.
trivy:
  stage: image-scan
  script:
    - mkdir -p reports
    - |
      trivy image --scanners vuln --severity HIGH,CRITICAL \
        --ignore-unfixed --no-progress --format json \
        --output reports/trivy.json "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      trivy image --scanners vuln --severity HIGH,CRITICAL \
        --ignore-unfixed --exit-code 1 --no-progress "$IMAGE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    when: always
    paths:
      - reports/trivy.json
    expire_in: 90 days

# ---- Software Bill of Materials ----
# An inventory of everything inside the image: OS packages, Python libraries,
# versions and licences. Without one, "are we affected by this CVE?" means
# rebuilding old images and guessing. With one it is a query against an
# artifact that was recorded at build time.
#
# Two formats because consumers differ: CycloneDX is what scanners read, SPDX
# is what licence and procurement tooling expects.
sbom:
  stage: image-scan
  script:
    - mkdir -p reports
    # Package-level only. The default also catalogues every file in the image,
    # which here is 2700 entries of noise around 112 real packages.
    - |
      syft scan "docker:$IMAGE:$CI_COMMIT_SHORT_SHA" \
        --select-catalogers "-file" \
        -o "cyclonedx-json=reports/sbom.cdx.json" \
        -o "spdx-json=reports/sbom.spdx.json" \
        -q
    - |
      syft scan "docker:$IMAGE:$CI_COMMIT_SHORT_SHA" \
        --select-catalogers "-file" -o table -q | tee reports/sbom.txt | head -20
  artifacts:
    paths:
      - reports/sbom.cdx.json
      - reports/sbom.spdx.json
      - reports/sbom.txt
    # Longer than the default: the point of an SBOM is answering questions
    # months after the build.
    expire_in: 1 year

# ---- Security gate 3: vulnerabilities, second opinion ----
# Grype scans the SBOM rather than the image, and uses a different
# vulnerability database from Trivy. That is the point: on the first run it
# found a fixable CRITICAL in the Python interpreter that Trivy reported clean,
# which is why the base image moved from 3.14.8 to 3.14.10.
#
# Policy and justified ignores live in .grype.yaml.
grype:
  stage: image-scan
  needs:
    - job: sbom
      artifacts: true
  script:
    - grype "sbom:reports/sbom.cdx.json" -o json --file reports/grype.json -q
    - grype "sbom:reports/sbom.cdx.json" -q
  artifacts:
    when: always
    paths:
      - reports/grype.json
    expire_in: 90 days

# Minikube keeps its own image store, so a locally built image has to be
# side-loaded before the cluster can run it. Replaced by a registry push once
# the cloud environment exists.
minikube-load:
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:dev"
    - minikube image load "$IMAGE:dev"

# ---- Automated compliance reporting ----
# Job logs age out, and a log is not evidence. This produces one durable
# artifact per build recording what was scanned, by what, with what result,
# and what is inside the image — the thing to hand over when someone asks
# months later whether a given release was checked.
compliance-report:
  stage: report
  needs:
    - job: trivy
      artifacts: true
    - job: grype
      artifacts: true
    - job: sbom
      artifacts: true
    - job: gitleaks
      artifacts: true
    - job: sonarqube
      artifacts: true
  script:
    - python3 .ci/compliance-report.py
  artifacts:
    when: always
    # Everything the Pages job serves has to be published here, including the
    # SBOM files this job only passes through.
    paths:
      - reports/compliance.md
      - reports/index.html
      - reports/sbom.txt
      - reports/sbom.cdx.json
      - reports/sbom.spdx.json
      - reports/trivy.json
      - reports/grype.json
    expire_in: 1 year

# ---- Publish the compliance report ----
# GitLab will not render a Markdown or JSON job artifact in the browser, only
# offer it for download. Pages serves the same files as a readable page, which
# is what makes the evidence usable rather than merely archived.
pages:
  stage: report
  needs:
    - job: compliance-report
      artifacts: true
  script:
    - mkdir -p public
    - cp reports/index.html reports/compliance.md public/
    - cp reports/sbom.txt reports/sbom.cdx.json reports/sbom.spdx.json public/
    - cp reports/trivy.json reports/grype.json public/
  artifacts:
    paths:
      - public
  rules:
    # Only the default branch publishes: a site built from a feature branch
    # would overwrite the published one with unreviewed content.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
